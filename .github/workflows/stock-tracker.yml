name: Stock Tracker

on:
  schedule:
    - cron: '45 6 * * 1-5'  # 每個交易日 下午 2:45 台灣時間

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install yfinance requests
      
      - name: Run stock tracker
        run: python stock_tracker.py
