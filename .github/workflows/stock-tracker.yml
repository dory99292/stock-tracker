name: Stock Tracker

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2 2 * * 1-5'      # 早上 10:00 台灣時間 (UTC+8)
    - cron: '2 4 * * 1-5'      # 中午 12:00 台灣時間 (UTC+8)
    - cron: '2 14 * * 1-5'     # 晚上 22:00 台灣時間 (UTC+8)

jobs:
  stock-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install yfinance requests
      
      - name: Run stock tracker
        run: python stock_tracker.py