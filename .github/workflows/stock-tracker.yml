name: Stock Tracker

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1-5'

jobs:
  stock-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install yfinance requests
      
      - name: Run stock tracker
        run: python stock_tracker.py